services:
  postgres:
    image: postgres:15-alpine
    container_name: cocina_chivis_postgres
    environment:
      POSTGRES_DB: cocina_chivis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cocina_chivis_backend
    environment:
      NODE_ENV: development
      PORT: 5001
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: cocina_chivis
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cocina_chivis_frontend
    environment:
      VITE_API_URL: http://localhost:5001/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app_network
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge